# Render Blueprint for the chat API (apps/api). The web app is deployed on Vercel.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: apex-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
       # migrations run at build time (preDeployCommand needs a paid plan); the runner is idempotent
    buildCommand: npm ci --include=dev && npm run db:migrate && npm run build -w @apex/widget
    startCommand: npm start -w @apex/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      # keeps the demo tenant (data/tenants.json) from loading
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: verify
      - key: TRUST_PROXY
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APEX_MODEL
        value: claude-haiku-5-5
      # hybrid search (docs/adr/0002-hybrid-retrieval.md); needs a paid Gemini key
      - key: APEX_EMBEDDINGS
        value: gemini:gemini-embedding-2@768
      - key: GEMINI_API_KEY
        sync: false
      # "paid" once billing is on for that key; /admin/usage warns about the free tier's quota until then
      - key: APEX_GEMINI_TIER
        value: free
      - key: RESEND_API_KEY
        sync: false
      # the same secret as on Vercel; opens /health/details to /admin/system
      - key: APEX_HEALTH_TOKEN
        sync: false
